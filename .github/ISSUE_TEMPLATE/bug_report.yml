name: Bug report
description: Something in a kit does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, tokens or client data.
  - type: dropdown
    id: kit
    attributes:
      label: Kit
      description: Which kit is affected?
      options:
        - kit-web-scrolling
        - kit-instagram-web
        - kit-auditoria-seo
        - kit-dashboard-facturas
        - kit-automatizaciones-n8n
        - kit-prospeccion
        - kit-auditoria-negocio
        - kit-auditoria-meta-ads
        - kit-extension-chrome
        - kit-skill-creator
        - repository tooling / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the prompt you used and the relevant part of the output.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open kits/...
        2. Type "..."
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Claude Code CLI 2.x / VS Code extension, macOS 15, Node 22
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any credentials and personal data from this report.
          required: true
